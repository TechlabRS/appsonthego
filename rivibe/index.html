    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sky-primary': '#38bdf8',
                        'rich-accent': '#8b5cf6',
                        'rich-pink': '#d946ef',
                        'bg-deep': '#05070a',
                    }
                }
            }
        }

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        :root {
            --bg-deep: #05070a;
            --card-dark: #0f1218;
            --sky-primary: #38bdf8;
            --sky-light: #bae6fd;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* The Invisible 'i' - Subtle & High-End */
        .invisible-i {
            opacity: 0.25;
            font-weight: 300;
            color: var(--sky-primary);
        }

        /* Luxury PIN Dots */
        .pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pin-dot.filled {
            background: var(--sky-primary);
            border-color: var(--sky-light);
            transform: scale(1.3);
            box-shadow: 0 0 10px var(--sky-primary);
        }

        /* Stunning Card Design */
        .vibe-card {
            background: linear-gradient(145deg, #161a22, #0f1218);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .vibe-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
        }
        .vibe-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.15);
        }

        /* Progressive Mood Drawer */
        #mood-drawer {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #mood-drawer.open {
            max-height: 400px;
            opacity: 1;
            margin-top: 1rem;
        }

        .mood-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .mood-chip:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--sky-primary);
        }
        .mood-chip.active {
            background: var(--sky-primary);
            color: #000;
        }

        /* Capsule Filters */
        .capsule {
            padding: 0.4rem 1rem;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 900;
            color: #64748b;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .capsule.active {
            background: var(--sky-primary);
            border-color: var(--sky-primary);
            color: #000;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
        }

        /* Glowing Rich Buttons */
        .btn-rich {
            background: linear-gradient(135deg, #38bdf8 0%, #8b5cf6 50%, #d946ef 100%);
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.25);
            transition: all 0.3s ease;
        }
        .btn-rich:hover {
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        /* Glass Input */
        .glass-input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: var(--sky-primary) !important;
            background: rgba(255, 255, 255, 0.07) !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.1) !important;
        }

        /* Custom Scroll */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--sky-primary); border-radius: 10px; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, query, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXECIZa45dq-o8Ka4G9Y1N7nll7cyli2U",
            authDomain: "stuattnd.firebaseapp.com",
            projectId: "stuattnd",
            storageBucket: "stuattnd.firebasestorage.app",
            messagingSenderId: "511533506488",
            appId: "1:511533506488:web:aca4de3d513915d012f94d",
            measurementId: "G-9PZZM5LFKX"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rivibe-on';
        
        let user = null;
        let masterKey = "";
        let currentPin = "";
        let editingId = null;
        let currentViewId = null;
        let entries = [];
        let activeTimeFilter = 'all';

        const MOODS = [
            { emoji: '✨', label: 'Radiant' }, { emoji: '👑', label: 'Power' },
            { emoji: '🙂', label: 'Calm' }, { emoji: '💡', label: 'Creative' },
            { emoji: '🌪️', label: 'Heavy' }, { emoji: '🔋', label: 'Tired' },
            { emoji: '🌫️', label: 'Vague' }, { emoji: '😐', label: 'Neutral' }
        ];

        // BOOTSTRAP
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch(e) { console.error(e); }
        };

        onAuthStateChanged(auth, (u) => { user = u; });
        initAuth();

        window.inputPin = async (n) => {
            if (currentPin.length >= 6) return;
            currentPin += n;
            updateDots();
            if (currentPin.length === 6) {
                const hashed = CryptoJS.SHA256(currentPin).toString();
                const secRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security');
                const secDoc = await getDoc(secRef);
                if (!secDoc.exists()) {
                    await setDoc(secRef, { pinHash: hashed });
                    unlock(currentPin);
                } else {
                    if (secDoc.data().pinHash === hashed) unlock(currentPin);
                    else { resetPin(); showToast("Invalid Protocol Key"); }
                }
            }
        };

        const updateDots = () => {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((d, i) => i < currentPin.length ? d.classList.add('filled') : d.classList.remove('filled'));
        };

        window.resetPin = () => { currentPin = ""; updateDots(); };
        window.backspacePin = () => { currentPin = currentPin.slice(0, -1); updateDots(); };

        const unlock = (pin) => {
            masterKey = pin;
            document.getElementById('auth-screen').classList.add('hidden');
            const main = document.getElementById('main-app');
            main.classList.remove('hidden');
            setTimeout(() => main.classList.replace('opacity-0', 'opacity-100'), 50);
            renderMoodGrid();
            subscribe();
        };

        const encrypt = (t) => CryptoJS.AES.encrypt(t, masterKey).toString();
        const decrypt = (c) => {
            try {
                const bytes = CryptoJS.AES.decrypt(c, masterKey);
                return bytes.toString(CryptoJS.enc.Utf8) || "[Encrypted]";
            } catch { return "[Secure Fragment]"; }
        };

        const subscribe = () => {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'entries');
            onSnapshot(q, (snapshot) => {
                entries = snapshot.docs.map(d => ({ 
                    id: d.id, 
                    ...d.data(),
                    decryptedContent: decrypt(d.data().content) // Decrypt once for searching
                }));
                applyFilters();
            }, (err) => showToast("Sync Interrupted"));
        };

        // SEARCH & FILTER LOGIC
        window.setFilter = (type) => {
            activeTimeFilter = type;
            document.querySelectorAll('.capsule').forEach(c => c.classList.remove('active'));
            if(type !== 'custom') document.getElementById(`filter-${type}`).classList.add('active');
            applyFilters();
        };

        window.resetFilters = () => {
            document.getElementById('global-search').value = "";
            document.getElementById('filter-from').value = "";
            document.getElementById('filter-to').value = "";
            setFilter('all');
        };

        window.applyFilters = () => {
            const searchTerm = document.getElementById('global-search').value.toLowerCase();
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;
            
            let filtered = entries.filter(e => {
                const matchesSearch = e.decryptedContent.toLowerCase().includes(searchTerm) || 
                                     e.tags.some(t => t.toLowerCase().includes(searchTerm));
                
                const eDate = new Date(e.date);
                const now = new Date();
                let matchesTime = true;

                if (activeTimeFilter === 'week') {
                    const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
                    matchesTime = eDate >= startOfWeek;
                } else if (activeTimeFilter === 'month') {
                    matchesTime = eDate.getMonth() === now.getMonth() && eDate.getFullYear() === now.getFullYear();
                } else if (activeTimeFilter === 'custom' && fromDate && toDate) {
                    matchesTime = eDate >= new Date(fromDate) && eDate <= new Date(toDate);
                }

                return matchesSearch && matchesTime;
            });

            renderFeed(filtered);
            updateStats(filtered);
        };

        const renderFeed = (filteredData) => {
            const feed = document.getElementById('entries-feed');
            const empty = document.getElementById('empty-state');
            feed.innerHTML = "";
            
            if (filteredData.length === 0) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            filteredData.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(e => {
                const div = document.createElement('div');
                div.className = "vibe-card p-5 flex flex-col cursor-pointer";
                div.onclick = () => openView(e.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-3xl">${e.mood.split(' ')[0]}</span>
                        <div class="text-right">
                            <p class="text-[8px] font-black text-slate-500 uppercase tracking-widest">${e.date}</p>
                            <p class="text-[9px] font-black text-sky-primary uppercase tracking-widest mt-1">${e.mood.split(' ')[1]}</p>
                        </div>
                    </div>
                    <p class="text-slate-400 text-sm leading-relaxed line-clamp-3 flex-grow font-medium">${e.decryptedContent}</p>
                    <div class="flex flex-wrap gap-2 mt-4">
                        ${e.tags.map(t => `<span class="bg-white/5 px-2 py-1 rounded-md text-[8px] font-black text-slate-500 uppercase tracking-tighter">#${t}</span>`).join('')}
                    </div>
                `;
                feed.appendChild(div);
            });
        };

        // VIEW UI ACTIONS (READ ONLY)
        window.openView = (id) => {
            const e = entries.find(x => x.id === id);
            if(!e) return;
            currentViewId = id;
            
            const [emoji, label] = e.mood.split(' ');
            document.getElementById('view-mood-emoji').innerText = emoji;
            document.getElementById('view-mood-label').innerText = label;
            document.getElementById('view-date').innerText = e.date;
            document.getElementById('view-content').innerText = e.decryptedContent;
            
            document.getElementById('view-tags').innerHTML = e.tags.map(t => 
                `<span class="bg-white/10 px-3 py-1.5 rounded-lg text-[9px] font-black text-slate-400 uppercase tracking-widest">#${t}</span>`
            ).join('');

            document.getElementById('view-modal').classList.remove('hidden');
        };

        window.closeViewModal = () => {
            document.getElementById('view-modal').classList.add('hidden');
            currentViewId = null;
        };

        window.openEditFromView = () => {
            const idToEdit = currentViewId;
            closeViewModal();
            openEdit(idToEdit);
        };

        window.handleDeleteFromView = async () => {
            if(!currentViewId) return;
            if(confirm("Permanently erase this vibe?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'entries', currentViewId));
                closeViewModal();
                showToast("Vibe Vaporized");
            }
        };

        // EDIT/CREATE UI ACTIONS
        window.openModal = () => {
            editingId = null;
            document.getElementById('modal-title').innerText = "Archive Moment";
            document.getElementById('form-date').valueAsDate = new Date();
            document.getElementById('form-content').value = "";
            document.getElementById('form-tags').value = "";
            document.getElementById('entry-modal').classList.remove('hidden');
            selectMood('✨', 'Radiant');
        };

        const openEdit = (id) => {
            const e = entries.find(x => x.id === id);
            editingId = id;
            document.getElementById('modal-title').innerText = "Refine Archive";
            document.getElementById('form-date').value = e.date;
            document.getElementById('form-content').value = e.decryptedContent;
            document.getElementById('form-tags').value = e.tags.join(', ');
            const [emo, lbl] = e.mood.split(' ');
            selectMood(emo, lbl);
            document.getElementById('entry-modal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('entry-modal').classList.add('hidden');
            document.getElementById('mood-drawer').classList.remove('open');
            document.getElementById('trigger-icon').classList.remove('rotate-180');
        };

        window.toggleMoodDrawer = () => {
            document.getElementById('mood-drawer').classList.toggle('open');
            document.getElementById('trigger-icon').classList.toggle('rotate-180');
        };

        const renderMoodGrid = () => {
            const grid = document.getElementById('mood-grid');
            grid.innerHTML = MOODS.map(m => `
                <div onclick="selectMood('${m.emoji}', '${m.label}')" class="mood-chip p-3 md:p-4 rounded-xl flex flex-col items-center gap-1 cursor-pointer">
                    <span class="text-2xl">${m.emoji}</span>
                    <span class="text-[8px] font-black uppercase tracking-widest text-center">${m.label}</span>
                </div>
            `).join('');
        };

        window.selectMood = (emoji, label) => {
            document.getElementById('trigger-emoji').innerText = emoji;
            document.getElementById('trigger-label').innerText = label;
            document.getElementById('form-mood').value = `${emoji} ${label}`;
            setTimeout(() => {
                document.getElementById('mood-drawer').classList.remove('open');
                document.getElementById('trigger-icon').classList.remove('rotate-180');
            }, 200);
        };

        window.saveEntry = async () => {
            const content = document.getElementById('form-content').value;
            if(!content) return showToast("Archive remains empty");
            const data = {
                date: document.getElementById('form-date').value,
                mood: document.getElementById('form-mood').value,
                content: encrypt(content),
                tags: document.getElementById('form-tags').value.split(',').map(t => t.trim()).filter(t => t),
                updatedAt: new Date().toISOString()
            };
            const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'entries');
            try {
                if(editingId) await updateDoc(doc(colRef, editingId), data);
                else await setDoc(doc(colRef), data);
                closeModal();
                showToast("Vault Committed");
            } catch(e) { showToast("Cloud Sync Error"); }
        };

        window.exportData = () => {
            const backup = entries.map(e => ({...e, decrypted: decrypt(e.content)}));
            const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `RiVibe_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showToast("Export Dispatched");
        };

        window.importData = (input) => {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = JSON.parse(ev.target.result);
                const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'entries');
                for(let item of data) {
                    const c = item.decrypted || decrypt(item.content);
                    await setDoc(doc(colRef), {
                        date: item.date, mood: item.mood, content: encrypt(c),
                        tags: item.tags, updatedAt: new Date().toISOString()
                    });
                }
                showToast("Archives Restored");
            };
            reader.readAsText(file);
        };

        const updateStats = (currentSet) => {
            document.getElementById('stat-count').innerText = currentSet.length;
            if(currentSet.length > 0) {
                const counts = {};
                currentSet.forEach(e => {
                    const l = e.mood.split(' ')[1];
                    counts[l] = (counts[l] || 0) + 1;
                });
                const top = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
                document.getElementById('stat-mood').innerText = top.toUpperCase();
            } else {
                document.getElementById('stat-mood').innerText = "—";
            }
        };

        const showToast = (m) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = m;
            t.classList.replace('opacity-0', 'opacity-100');
            t.classList.replace('translate-y-12', 'translate-y-0');
            setTimeout(() => {
                t.classList.replace('opacity-100', 'opacity-0');
                t.classList.replace('translate-y-0', 'translate-y-12');
            }, 3000);
        };
    </script>
</body>
</html>
