<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGMCET - Attendance Shortage Undertaking Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f19;
  --bg-subtle: #111827;
  --card: rgba(23, 32, 54, 0.65);
  --border: rgba(255, 255, 255, 0.08);
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-glow: rgba(99, 102, 241, 0.35);
  --accent: #8b5cf6;
  --wa: #10b981;
  --wa-hover: #059669;
  --wa-glow: rgba(16, 185, 129, 0.3);
  --parent-wa: #0ea5e9;
  --parent-wa-hover: #0284c7;
  --warn: #f43f5e;
  --warn-bg: rgba(244, 63, 94, 0.12);
  --warn-border: rgba(244, 63, 94, 0.3);
  --amber: #f59e0b;
  --amber-bg: rgba(245, 158, 11, 0.12);
  --amber-border: rgba(245, 158, 11, 0.3);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
    radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 60%);
  background-attachment: fixed;
  color: var(--text-main);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; margin: 0; letter-spacing: -0.02em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

.top-nav {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  background: rgba(11, 15, 25, 0.85);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; }
.nav-logo {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: grid; place-items: center; font-weight: 800; font-size: 18px;
  color: #fff; box-shadow: 0 4px 12px var(--primary-glow);
}
.nav-info b { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; }
.nav-info small { color: var(--text-muted); font-size: 12px; }

.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

.card {
  background: var(--card);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.card:hover { border-color: rgba(255, 255, 255, 0.14); }

.btn {
  border: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary-hover));
  color: #fff; padding: 10px 18px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 13.5px; cursor: pointer; min-height: 42px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  text-decoration: none; box-shadow: 0 4px 14px var(--primary-glow);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn:hover {
  transform: translateY(-1.5px);
  box-shadow: 0 6px 20px var(--primary-glow);
  filter: brightness(1.08);
}
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; pointer-events: none; box-shadow: none; }

.btn.ghost {
  background: rgba(255, 255, 255, 0.05); color: var(--text-main);
  border: 1px solid var(--border); box-shadow: none;
}
.btn.ghost:hover {
  background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2);
}
.btn.small { padding: 5px 10px; min-height: 32px; font-size: 12.5px; border-radius: 6px; }
.btn.wa {
  background: linear-gradient(135deg, var(--wa), var(--wa-hover));
  box-shadow: 0 4px 14px var(--wa-glow);
}
.btn.wa:hover { box-shadow: 0 6px 20px var(--wa-glow); }
.btn.wa-parent {
  background: linear-gradient(135deg, var(--parent-wa), var(--parent-wa-hover));
  box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
}

label {
  display: block; font-weight: 600; font-size: 13px;
  color: var(--text-muted); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.05em;
}
input[type=text], input[type=email], input[type=password], input[type=search] {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: rgba(11, 15, 25, 0.6);
  color: #fff; min-height: 44px; transition: all 0.2s ease;
}
input:focus {
  border-color: var(--primary); outline: none;
  background: rgba(11, 15, 25, 0.9);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
}

.tabs {
  display: flex; gap: 4px; background: rgba(0,0,0,0.25);
  padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  margin-bottom: 16px;
}
.tabs button {
  flex: 1; background: none; border: 0; padding: 10px;
  font-weight: 600; font-size: 13px; color: var(--text-muted); cursor: pointer;
  border-radius: 6px; transition: all 0.15s ease;
}
.tabs button.on { background: rgba(255, 255, 255, 0.08); color: #fff; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700;
}
.b-pend { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.b-sign { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
.b-low { background: var(--warn-bg); color: #fb7185; border: 1px solid var(--warn-border); }

.pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }

.hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.gauge { position: relative; width: 140px; height: 140px; flex: none; }
.gauge svg { transform: rotate(-90deg); filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.3)); }
.gauge .v {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: #fb7185;
}
.gauge .v small { display: block; font: 600 11px 'Plus Jakarta Sans'; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; font-size: 14px; margin-top: 14px; }
.kv dt { color: var(--text-dim); font-weight: 500; }
.kv dd { margin: 0; font-weight: 600; color: var(--text-main); word-break: break-word; }

/* Institutional Paper Undertaking Box */
.undertaking-paper {
  background: #fdfbf7;
  color: #1a1a1a;
  border-radius: var(--radius-sm);
  padding: 24px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.65;
  font-size: 15px;
}
.undertaking-paper h4 {
  font-family: Georgia, serif;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  text-decoration: underline;
  margin-bottom: 16px;
  color: #0b1a30;
}
.undertaking-header { margin-bottom: 16px; font-size: 14px; }
.undertaking-header div { margin-bottom: 3px; }
.undertaking-body { text-align: justify; margin-bottom: 20px; }

.chk {
  display: flex; gap: 12px; align-items: flex-start;
  margin-top: 18px; font-weight: 500; font-size: 14px; color: #e2e8f0;
}
.chk input {
  width: 20px; height: 20px; margin-top: 2px; accent-color: var(--primary);
  flex: none; cursor: pointer;
}

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
.stat {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 18px 14px; text-align: center;
  backdrop-filter: blur(10px);
}
.stat b { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-top: 4px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.chip {
  border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04);
  border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: 13px;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s ease;
}
.chip:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.chip.on {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; border-color: transparent; box-shadow: 0 2px 10px var(--primary-glow);
}

.row {
  display: flex; gap: 14px; align-items: center; justify-content: space-between;
  padding: 14px 0; border-top: 1px solid var(--border); flex-wrap: wrap;
}
.row:first-child { border-top: 0; }
.row .who { min-width: 0; flex: 1 1 220px; }
.row .who b { display: block; font-size: 15px; color: #fff; }
.row .who span { font-size: 13px; color: var(--text-muted); word-break: break-all; }
.row .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pct {
  font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700;
  color: #fb7185; min-width: 55px; text-align: right;
}

.blast-box {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(6, 95, 70, 0.05));
  border: 1px solid rgba(16, 185, 129, 0.25);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px;
}
.blast-box h4 { margin: 0 0 6px; font-size: 18px; color: #34d399; }
.blast-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

.tpl-link {
  font-size: 12px; font-weight: 600; color: #a5b4fc;
  cursor: pointer; text-decoration: none; float: right; padding: 2px 8px;
  border-radius: 4px; background: rgba(99, 102, 241, 0.1);
  transition: all 0.15s ease;
}
.tpl-link:hover { background: rgba(99, 102, 241, 0.2); color: #fff; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(12px);
  color: #fff; border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  padding: 12px 22px; border-radius: 99px; font-size: 14px; font-weight: 600;
  z-index: 99; max-width: 90vw; animation: toastUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes toastUp { from { opacity: 0; transform: translate(-50%, 15px); } to { opacity: 1; transform: translate(-50%, 0); } }

.modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
  z-index: 90; padding: 16px;
}
.modal-body {
  background: var(--bg-subtle); border: 1px solid var(--border);
  padding: 28px; border-radius: var(--radius-lg); max-width: 480px; width: 100%;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  animation: modalScale 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.empty { text-align: center; padding: 48px 16px; color: var(--text-dim); }
.loader { text-align: center; padding: 80px 20px; font-weight: 600; color: var(--text-muted); }
.err {
  background: var(--warn-bg); border: 1px solid var(--warn-border);
  color: #fb7185; padding: 12px 14px; border-radius: var(--radius-sm);
  margin-top: 14px; font-size: 14px; font-weight: 500;
}
</style>
</head>
<body>
<div id="app"><div class="loader">✨ Loading RGMCET Undertaking Portal…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyBXECIZa45dq-o8Ka4G9Y1N7nll7cyli2U",
    authDomain: "stuattnd.firebaseapp.com",
    projectId: "stuattnd",
    storageBucket: "stuattnd.firebasestorage.app",
    messagingSenderId: "511533506488",
    appId: "1:511533506488:web:aca4de3d513915d012f94d",
    measurementId: "G-9PZZM5LFKX"
  },
  institution: "RGMCET",
  fullNameInstitution: "Rajeev Gandhi Memorial College of Engineering & Technology",
  term: "2026-ODD",
  cutoffDateText: "August 31st 2026",
  minAtt: 75,
  basePath: "artifacts/att-mail"
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanStr = s => String(s ?? '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
const app = $('#app');
let auth, db;

const S = { 
  user: null, 
  role: null, 
  student: null, 
  hod: null, 
  rows: [], 
  filter: 'all', 
  q: '', 
  authTab: 'in'
};

const pCol = name => `${CONFIG.basePath}/${name}`;
const pDoc = (col, id) => `${CONFIG.basePath}/${col}/${id}`;

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}

function friendly(e){
  const m={ 
    'auth/invalid-credential':'Wrong email or password.',
    'auth/user-not-found':'No HOD account found with this email.',
    'auth/wrong-password':'Wrong email or password.',
    'auth/email-already-in-use':'An account already exists. Please Sign In.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/invalid-email':'Enter a valid institutional email address.',
    'auth/too-many-requests':'Too many attempts. Try again in a few minutes.',
    'permission-denied':'Access restricted. Check security rules or authorization.' 
  };
  return m[e.code] || e.message || 'Something went wrong.';
}

function formatPhone(phone, defaultCountry = '91'){
  if(!phone) return '';
  let digits = String(phone).replace(/\D/g, '');
  if(!digits) return '';
  if(digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
  if(digits.length === 10) digits = defaultCountry + digits;
  return digits;
}

function getPortalUrl(){
  return location.href.split('#')[0];
}

function generateAccessToken(){
  return Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
}

function getStudentAccessUrl(student){
  const base = getPortalUrl();
  let token = student.token;
  if (!token || token === 'token_pending') {
    token = generateAccessToken();
    student.token = token;
    if (student.id) {
      db.doc(pDoc('students', student.id)).update({ token: token }).catch(console.error);
    }
  }
  return `${base}#access?email=${encodeURIComponent(student.id || student.email)}&token=${encodeURIComponent(token)}`;
}

function copyToClipboard(text, successMsg){
  navigator.clipboard.writeText(text).then(()=>{
    if(successMsg) toast(successMsg);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    if(successMsg) toast(successMsg);
  });
}

function studentMessage(s){
  const directLink = getStudentAccessUrl(s);
  return `*RGMCET - ATTENDANCE SHORTAGE UNDERTAKING*
Dear ${s.name} (Regd No: ${s.roll}),

Your recorded attendance till *${s.cutoffDateText || CONFIG.cutoffDateText}* is *${s.att}%*, which is below the required 75%.

Please open your direct link to submit your official undertaking (No login/password required):
🔗 ${directLink}

- Office of Head of Department, ${s.dept}
RGMCET`;
}

function parentMessage(s){
  const directLink = getStudentAccessUrl(s);
  return `*RGMCET - NOTICE FOR PARENTS*
Dear Parent / Guardian,

This is regarding your ward *${s.name}* (Regd No: *${s.roll}*), Department of *${s.dept}*, RGMCET.

Your ward's attendance till *${s.cutoffDateText || CONFIG.cutoffDateText}* is *${s.att}%* (< 75%). An official undertaking must be authenticated:
🔗 ${directLink}

- Office of Head of Department, ${s.dept}
RGMCET`;
}

function buildStudentWaLink(s){
  const phone = formatPhone(s.mobile);
  if(!phone) return null;
  return `https://wa.me/${phone}?text=${encodeURIComponent(studentMessage(s))}`;
}

function buildParentWaLink(s){
  const phone = formatPhone(s.parentMobile);
  if(!phone) return null;
  return `https://wa.me/${phone}?text=${encodeURIComponent(parentMessage(s))}`;
}

async function checkMagicLinkAccess(){
  const hash = window.location.hash;
  if (!hash.startsWith('#access?')) return false;

  const params = new URLSearchParams(hash.substring(8));
  const email = (params.get('email') || '').trim().toLowerCase();
  const token = (params.get('token') || '').trim();

  if (!email || !token) return false;

  app.innerHTML = '<div class="loader">🔑 Loading your official undertaking form…</div>';
  try {
    const docSnap = await db.doc(pDoc('students', email)).get();
    if (!docSnap.exists) {
      toast('Invalid link or student record not found.');
      return false;
    }
    const data = docSnap.data();
    if (data.token !== token) {
      toast('Expired or invalid security link.');
      return false;
    }

    S.user = { email: email };
    S.role = 'student';
    S.student = { id: docSnap.id, ...data };
    
    history.replaceState(null, '', getPortalUrl());
    viewStudent();
    toast(`Welcome, ${data.name}!`);
    return true;
  } catch(e) {
    console.error('Direct access link error:', e);
    return false;
  }
}

function boot(){
  if (CONFIG.firebase.apiKey === 'YOUR_API_KEY'){ 
    app.innerHTML = '<div class="wrap"><div class="card"><h2>Firebase configuration required.</h2></div></div>';
    return;
  }
  firebase.initializeApp(CONFIG.firebase);
  auth = firebase.auth(); 
  db = firebase.firestore();

  checkMagicLinkAccess().then(handled => {
    if (handled) return;

    auth.onAuthStateChanged(async u => {
      if (S.student && !u) return;

      S.user = u; S.role = null; S.hod = null; S.rows = [];
      if(!u) return viewAuth();

      app.innerHTML = '<div class="loader">Verifying Admin permissions…</div>';
      try {
        const email = u.email.toLowerCase();
        const hd = await db.doc(pDoc('hods', email)).get();
        if (!hd.exists) {
          await auth.signOut();
          return viewAuth('Access denied: Only registered HOD/Admin accounts can log in here.');
        }
        S.role = 'hod'; 
        S.hod = { id: hd.id, ...hd.data() }; 
        await loadRows(); 
        return viewHod();
      } catch(e) { 
        await auth.signOut();
        viewAuth(friendly(e)); 
        toast(friendly(e)); 
      }
    });
  });
}

function header(sub){
  return `<header class="top-nav">
    <div class="nav-brand">
      <div class="nav-logo">R</div>
      <div class="nav-info">
        <b>RGMCET Attendance Undertaking Portal</b>
        <small>${esc(sub)} ${S.user?.email ? `· ${esc(S.user.email)}` : ''}</small>
      </div>
    </div>
    ${S.role === 'hod' ? '<button class="btn small ghost" id="out">Sign Out</button>' : ''}
  </header>`;
}

function bindOut(){ 
  const outBtn = $('#out');
  if(outBtn) {
    outBtn.onclick = () => {
      S.user = null; S.student = null; S.hod = null;
      auth.signOut();
      viewAuth();
    }; 
  }
}

function viewAuth(error){
  const up = S.authTab === 'up';

  app.innerHTML = `<div class="wrap"><div class="auth" style="max-width:440px;margin:40px auto">
   <div style="text-align:center;margin-bottom:24px">
     <h1 style="font-size:32px;font-weight:800;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
       RGMCET
     </h1>
     <p style="color:var(--text-muted);font-size:14px;margin-top:4px">HOD / Department Administrative Access</p>
   </div>

   <div class="card">
    <div class="tabs">
      <button id="t-in" class="${up ? '' : 'on'}">HOD Sign In</button>
      <!-- <button id="t-up" class="${up ? 'on' : ''}">Register HOD Account</button> -->
    </div>

    ${up ? `
      <label for="hn">HOD Full Name</label>
      <input id="hn" type="text" placeholder="e.g. Dr. K. Subba Reddy">
      <label for="hd">Department Code</label>
      <input id="hd" type="text" placeholder="e.g. CSE, AIML, ECE">
    ` : ''}

    <label for="em">Department Email</label>

function gauge(p){
  const r=56, c=2*Math.PI*r, off=c*(1-Math.min(p,100)/100);
  return `<div class="gauge">
    <svg width="140" height="140" viewBox="0 0 140 140">
      <defs>
        <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f43f5e" />
          <stop offset="100%" stop-color="#fb7185" />
        </linearGradient>
      </defs>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="v"><div>${p}%<small>Attendance</small></div></div>
  </div>`;
}

async function submitUndertaking(){
  const s = S.student, msg = $('#msg');
  const fail = t => { msg.innerHTML = `<div class="err">${esc(t)}</div>`; };
  if(!$('#ok').checked) return fail('Please tick the checkbox to agree to the undertaking.');
  
  if(cleanStr($('#tn').value) !== cleanStr(s.name)) {
    return fail('Type your name exactly as registered: ' + s.name);
  }

  const btn = $('#sub'); btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const ts = firebase.firestore.FieldValue.serverTimestamp();
    const data = {
      email: s.id,
      name: s.name,
      roll: s.roll,
      mobile: s.mobile || '',
      parentMobile: s.parentMobile || '',
      dept: s.dept,
      att: s.att,
      yearSem: s.yearSem || s.term || CONFIG.term,
      term: s.term || CONFIG.term,
      cutoffDateText: s.cutoffDateText || CONFIG.cutoffDateText,
      hodEmail: s.hodEmail || '',
      typedName: $('#tn').value.trim()
    };

    const pdf = buildTwoUpPdf([data]);
    const b64 = pdf.output('datauristring').split(',')[1];
    const fname = `Undertaking_${s.roll}.pdf`;

    const batch = db.batch();
    batch.set(db.doc(pDoc('declarations', `${data.term}_${s.id}`)), { ...data, signedAt: ts });
    batch.update(db.doc(pDoc('students', s.id)), { status: 'signed', signedAt: ts });

    if(s.hodEmail){
      batch.set(db.collection(pCol('mail')).doc(), {
        to: [s.hodEmail],
        cc: [s.id],
        message: {
          subject: `RGMCET Undertaking Submitted – ${s.name} (${s.roll})`,
          html: `<p>Student <b>${esc(s.name)}</b> (${esc(s.roll)}, ${esc(s.dept)}) has submitted the attendance undertaking for ${esc(s.att)}% attendance.</p>
                 <p>The half-A4 printable undertaking document is attached.</p>`,
          attachments: [{ filename: fname, path: 'data:application/pdf;base64,' + b64 }]
        }
      });
    }
    await batch.commit();
    pdf.save(fname);
    S.student = { ...s, status: 'signed' }; 
    viewStudent(); 
    toast('Undertaking submitted and downloaded.');
  } catch(e) { 
    btn.disabled = false; btn.textContent = 'Submit Undertaking'; 
    fail(friendly(e)); 
  }
}

function drawSingleUndertakingSlot(doc, d, startY){
  const M = 18;
  const W = 210;
  let y = startY + 12;

  doc.setFont('times', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(15, 23, 42);
  const title = `Undertaking from the Student of  ${d.name}  (RGMCET)`;
  doc.text(title, W / 2, y, { align: 'center' });
  const titleWidth = doc.getTextWidth(title);
  doc.setLineWidth(0.3);
  doc.line((W - titleWidth) / 2, y + 1.2, (W + titleWidth) / 2, y + 1.2);

  y += 10;
  doc.setFontSize(10.5);
  doc.setFont('times', 'bold');
  doc.text('From:', M, y);
  
  doc.setFont('times', 'normal');
  const headers = [
    `Regd.No: ${d.roll}`,
    `Name: ${d.name}`,
    `Year & Semester: ${d.yearSem || d.term || CONFIG.term}`,
    `Branch: ${d.dept}`
  ];
  headers.forEach(h => {
    y += 5.2;
    doc.text(h, M, y);
  });

  y += 7.5;
  doc.text('Sir,', M, y);
  
  y += 5.5;
  const attVal = `${d.att}%`;
  const cutoff = d.cutoffDateText || CONFIG.cutoffDateText;
  const bodyText = `        I have attained ${attVal} Percentage of attendance till ${cutoff} and I understand that this may lead me to be detained, if I continue the same attitude.  I assure you that I will attain a minimum of 75% of attendance, which is the requirement in order to write the semester end examinations, in the future course. I also understand that I myself will be responsible completely if I get detained for the lack of required attendance of minimum of 75%.`;
  
  const splitText = doc.splitTextToSize(bodyText, W - (2 * M));
  doc.text(splitText, M, y, { lineHeightFactor: 1.35 });
  y += (splitText.length * 4.8) + 8;

  doc.text('Thanking you,', M, y);
  doc.text('Yours Sincerely', W - M - 30, y);
  y += 8;
  doc.setFont('times', 'bold');
  doc.text(d.typedName || d.name, W - M - 30, y);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(100, 116, 139);
  const when = (d.signedAt instanceof Date ? d.signedAt : new Date()).toLocaleString('en-GB');
  doc.text(`Authenticated via Direct Link: ${d.email} | Roll: ${d.roll} | Date: ${when}`, M, startY + 140);
}

function buildTwoUpPdf(records){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const halfHeight = 148.5;

  for (let i = 0; i < records.length; i += 2) {
    if (i > 0) doc.addPage();

    drawSingleUndertakingSlot(doc, records[i], 0);

    doc.setDrawColor(180, 190, 205);
    doc.setLineWidth(0.3);
    doc.setLineDashPattern([2.5, 2.5], 0);
    doc.line(8, halfHeight, 202, halfHeight);
    doc.setFontSize(7.5);
    doc.setTextColor(140, 150, 165);
    doc.text('✂ Cut Here (2 Slips per A4 Page)', 105, halfHeight - 1.5, { align: 'center' });
    doc.setLineDashPattern([], 0);

    if (records[i + 1]) {
      drawSingleUndertakingSlot(doc, records[i + 1], halfHeight);
    }
  }
  return doc;
}

function downloadSingleUndertakingPdf(student){
  const pdf = buildTwoUpPdf([student]);
  pdf.save(`Undertaking_${student.roll}.pdf`);
}

async function loadRows(){
  const q = await db.collection(pCol('students')).where('dept', '==', S.hod.dept).get();
  const repairBatch = db.batch();
  let needsRepair = false;

  S.rows = q.docs.map(d => {
    const data = d.data();
    let token = data.token;
    
    if (!token || token === 'token_pending') {
      token = generateAccessToken();
      repairBatch.update(d.ref, { token: token });
      needsRepair = true;
    }

    return { 
      id: d.id, 
      ...data, 
      token: token 
    };
  }).sort((a, b) => a.att - b.att);

  if (needsRepair) {
    repairBatch.commit().catch(console.error);
  }
}

function triggerDownload(content, filename){
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

        <dt>Attendance</dt><dd style="color:#fb7185">${esc(cur.att)}%</dd>
      </dl>
      <div style="display:flex;gap:10px">
        <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn wa" id="m-send" style="flex:2">
          👉 Open Chat & Send
        </a>
        <button class="btn ghost" id="m-skip" style="flex:1">Skip</button>
      </div>
      <p style="margin-top:14px;font-size:12px;color:var(--text-muted);text-align:center">
        Opening chat automatically copies the student link to your clipboard.
      </p>
      <div style="margin-top:12px;text-align:right">
        <button class="btn small ghost" id="m-cancel" style="border:0">Cancel Batch</button>
      </div>
    </div></div>`;

    $('#m-send').onclick = () => {
      copyToClipboard(accessUrl);
      setTimeout(() => {
        currentIdx++;
        renderModal();
      }, 700);
    };

    $('#m-skip').onclick = () => {
      currentIdx++;
      renderModal();
    };

    $('#m-cancel').onclick = () => { slot.innerHTML = ''; };
  }

  renderModal();
}

function parseCsv(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"' && text[i + 1] === '"'){ cur += '"'; i++; }
      else if(c === '"') q = false; 
      else cur += c;
    } else if(c === '"'){
      q = true;
    } else if(c === ','){
      row.push(cur); cur = '';
    } else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i + 1] === '\n') i++; 
      row.push(cur); cur = ''; 
      if(row.some(v => v.trim())) rows.push(row); 
      row = [];
    } else {
      cur += c;
    }
  }
  row.push(cur); 
  if(row.some(v => v.trim())) rows.push(row);
  return rows;
}

async function importMasterCsv(ev){
  const f = ev.target.files[0]; if(!f) return;
  const box = $('#mMsg'); box.innerHTML = '<p class="note" style="color:var(--text-muted)">Reading master directory…</p>';
  try {
    const rows = parseCsv(await f.text());
    if(!rows.length) throw new Error('Master CSV file is empty.');
    
    const rawHead = rows.shift();
    const head = rawHead.map(h => h.trim().toLowerCase().replace(/[\s\-_]/g, ''));
    const findCol = (...aliases) => head.findIndex(h => aliases.some(a => h.includes(a)));

    const iR = findCol('rollno', 'roll', 'regdno');
    const iN = findCol('name', 'studentname');
    const iM = findCol('mobile', 'phone', 'contact');
    const iE = findCol('email', 'mail');
    const iP = findCol('parentmobile', 'parentphone', 'parentcontact');
    const iY = findCol('yearsem', 'sem', 'year');

    if(iR < 0 || iN < 0 || iE < 0) {
      throw new Error('Master CSV requires columns: roll no, name, email (mobile, parent-mobile, year-sem optional).');
    }

    const ops = []; let bad = 0;
    for(const r of rows){
      const roll = (r[iR] || '').trim();
      const email = (r[iE] || '').trim().toLowerCase();
      const name = (r[iN] || '').trim();
      const mobile = iM >= 0 ? (r[iM] || '').trim() : '';
      const parentMobile = iP >= 0 ? (r[iP] || '').trim() : '';
      const yearSem = iY >= 0 ? (r[iY] || '').trim() : CONFIG.term;

      if(!roll || !email.includes('@') || !name){ bad++; continue; }

      const record = {
        roll, name, email, mobile, parentMobile, yearSem,
        dept: S.hod.dept,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      ops.push([roll.toUpperCase(), record]);
    }

    const totalBatches = Math.ceil(ops.length / 450);
    for(let i = 0; i < ops.length; i += 450){
      const batchNum = Math.floor(i / 450) + 1;
      box.innerHTML = `<p class="note" style="color:var(--text-muted)">Saving batch ${batchNum} of ${totalBatches}…</p>`;
      const b = db.batch(); 
      ops.slice(i, i + 450).forEach(([rollKey, data]) => {
        b.set(db.doc(pDoc('master_students', rollKey)), data, { merge: true });
      }); 
      await b.commit();
    }

    box.innerHTML = `<p class="note" style="color:#34d399"><b>${ops.length}</b> master student records stored${bad ? ` · ${bad} invalid lines skipped` : ''}.</p>`;
    toast(`Master directory updated: ${ops.length} students loaded.`);
  } catch(e) {
    box.innerHTML = `<div class="err">${esc(friendly(e))}</div>`;
  }
}

async function importShortageCsv(ev){
  const f = ev.target.files[0]; if(!f) return;
  const box = $('#sMsg'); box.innerHTML = '<p class="note" style="color:var(--text-muted)">Parsing shortage CSV…</p>';
  try {
    const rows = parseCsv(await f.text());
    if(!rows.length) throw new Error('Shortage CSV file is empty.');
    
    const rawHead = rows.shift();
    const head = rawHead.map(h => h.trim().toLowerCase().replace(/[\s\-_]/g, ''));
    const findCol = (...aliases) => head.findIndex(h => aliases.some(a => h.includes(a)));

    const iR = findCol('rollno', 'roll', 'regdno');
    const iE = findCol('email', 'mail');
    const iA = findCol('attendance', 'att', 'pct');

    if(iA < 0 || (iR < 0 && iE < 0)) {
      throw new Error('Shortage CSV must include attendance and roll no (or email).');
    }

    const candidateRows = [];
    let skipped = 0, bad = 0;

    for(const r of rows){
      const rawAtt = (r[iA] || '').replace('%', '').trim();
      const att = parseFloat(rawAtt);
      if(isNaN(att)){ bad++; continue; }
      if(att >= CONFIG.minAtt){ skipped++; continue; }

      const rollVal = iR >= 0 ? (r[iR] || '').trim().toUpperCase() : '';
      const emailVal = iE >= 0 ? (r[iE] || '').trim().toLowerCase() : '';
      if(!rollVal && !emailVal){ bad++; continue; }

      candidateRows.push({ roll: rollVal, email: emailVal, att: Math.round(att * 10) / 10 });
    }

    if(!candidateRows.length){
      box.innerHTML = `<p class="note" style="color:var(--text-muted)">No shortage records below 75% found (${skipped} students passed).</p>`;
      return;
    }

    box.innerHTML = `<p class="note" style="color:var(--text-muted)">Looking up ${candidateRows.length} students in Master Directory…</p>`;

    const masterMap = {};
    const rollKeys = [...new Set(candidateRows.map(c => c.roll).filter(Boolean))];

    for(let i = 0; i < rollKeys.length; i += 30){
      const chunk = rollKeys.slice(i, i + 30);
      const snap = await db.collection(pCol('master_students'))
        .where(firebase.firestore.FieldPath.documentId(), 'in', chunk)
        .get();
      snap.docs.forEach(doc => {
        masterMap[doc.id] = doc.data();
      });
    }

    const existingStudents = Object.fromEntries(S.rows.map(r => [r.id, r]));
    const ops = []; 
    let notFound = 0;

    for(const item of candidateRows){
      const master = masterMap[item.roll];
      if(!master || master.dept !== S.hod.dept){ 
        notFound++; 
        continue; 
      }

      const email = master.email.toLowerCase();
      const keep = existingStudents[email];
      const token = (keep && keep.token && keep.token !== 'token_pending') ? keep.token : generateAccessToken();

      const base = {
        name: master.name,
        roll: master.roll,
        mobile: master.mobile || '',
        parentMobile: master.parentMobile || '',
        yearSem: master.yearSem || CONFIG.term,
        dept: S.hod.dept,
        att: item.att,
        cutoffDateText: CONFIG.cutoffDateText,
        term: CONFIG.term,
        hodEmail: S.hod.id,
        token: token
      };

      ops.push([
        email, 
        keep && keep.status === 'signed' 
          ? { ...base, status: 'signed', signedAt: keep.signedAt || null } 
          : { ...base, status: 'pending', alerted: false }
      ]);
    }

    const totalBatches = Math.ceil(ops.length / 450);
    for(let i = 0; i < ops.length; i += 450){
      const batchNum = Math.floor(i / 450) + 1;
      box.innerHTML = `<p class="note" style="color:var(--text-muted)">Writing shortage batch ${batchNum} of ${totalBatches}…</p>`;
      const b = db.batch(); 
      ops.slice(i, i + 450).forEach(([id, data]) => b.set(db.doc(pDoc('students', id)), data, { merge: true })); 
      await b.commit();
    }

    await loadRows(); 
    viewHod();
    box.innerHTML = `<p class="note" style="color:#34d399"><b>${ops.length}</b> shortage records stored · ${skipped} with &ge;75% skipped${notFound ? ` · <b>${notFound} students not found in Master Directory</b>` : ''}${bad ? ` · ${bad} invalid lines ignored` : ''}.</p>`;
  } catch(e) { 
    box.innerHTML = `<div class="err">${esc(friendly(e))}</div>`; 
  }
}

async function sendAlerts(){
  const todo = S.rows.filter(r => r.status !== 'signed' && !r.alerted);
  if(!todo.length) return;
  if(!confirm(`Send email notices with 1-click undertaking links to ${todo.length} student(s)?`)) return;
  const btn = $('#alerts'); btn.disabled = true; btn.textContent = 'Queueing…';
  try {
    for(let i = 0; i < todo.length; i += 200){
      const b = db.batch();
      todo.slice(i, i + 200).forEach(s => {
        const directUrl = getStudentAccessUrl(s);

        b.set(db.collection(pCol('mail')).doc(), {
          to: [s.id],
          message: {
            subject: `Urgent: Attendance Undertaking Required (${s.roll})`,
            html: `<div style="font-family:sans-serif;line-height:1.6;color:#1e293b;max-width:600px">
              <h2 style="color:#e11d48;margin-bottom:4px">RGMCET - Attendance Undertaking Notice</h2>
              <p>Dear <b>${esc(s.name)}</b> (Regd.No: ${esc(s.roll)}),</p>
              <p>Your recorded attendance till <b>${esc(s.cutoffDateText || CONFIG.cutoffDateText)}</b> in Department of <b>${esc(s.dept)}</b> is <b style="color:#e11d48">${esc(s.att)}%</b>, which is below the mandatory 75%.</p>
              <div style="margin:22px 0">
                <a href="${directUrl}" style="background:#6366f1;color:#ffffff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block">
                  👉 Click to Submit Official Undertaking
                </a>
              </div>
              <p style="font-size:12px;color:#64748b">No login required. The above link opens your undertaking form directly.</p>
              <hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0">
              <p style="font-size:13px;color:#475569">Office of Head of Department, ${esc(s.dept)}<br>RGMCET</p>
            </div>`
          }
        });
        b.update(db.doc(pDoc('students', s.id)), { alerted: true });
      });
      await b.commit();
    }
    todo.forEach(s => s.alerted = true); 
    viewHod(); 
    toast(`${todo.length} email alert(s) queued.`);
  } catch(e) { 
    toast(friendly(e)); 
    btn.disabled = false; 
  }
}

boot();
</script>
