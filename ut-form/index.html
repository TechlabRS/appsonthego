<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Shortage Declaration Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16243a; --ink2:#4a5a72; --line:#d9dfe8; --paper:#f4f6f9; --card:#ffffff;
  --brand:#1d3a6e; --brand2:#2f5bb0; --warn:#b4231a; --warnbg:#fdecea;
  --ok:#17704f; --okbg:#e5f4ed; --amber:#8a5a00; --amberbg:#fff3d6;
  --wa:#128c7e; --wa-hover:#075e54;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.top{background:var(--brand);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-family:'Source Serif 4',serif;font-size:18px;font-weight:700}
.top small{display:block;opacity:.8;font-size:12px}
.wrap{max-width:940px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.btn{border:0;background:var(--brand);color:#fff;padding:11px 18px;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--brand2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.ghost:hover{background:#e9eef8}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px;border-radius:6px}
.btn.light{background:rgba(255,255,255,.15)}
.btn.light:hover{background:rgba(255,255,255,.28)}
.btn.wa{background:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-hover)}
.btn.wa-parent{background:#0277bd;color:#fff}
.btn.wa-parent:hover{background:#01579b}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=search]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;min-height:44px}
input:focus{border-color:var(--brand2);outline:none;box-shadow:0 0 0 3px #2f5bb033}
.err{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:8px;margin-top:12px;font-size:14px}
.note{color:var(--ink2);font-size:14px}
.portal-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.portal-switch button{padding:10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;color:var(--ink2)}
.portal-switch button.active{border-color:var(--brand);background:var(--brand);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-18px -18px 14px}
.tabs button{flex:1;background:none;border:0;padding:14px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.auth{max-width:440px;margin:28px auto}
.auth h1{font-size:26px;margin-bottom:4px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-pend{background:var(--amberbg);color:var(--amber)}
.b-sign{background:var(--okbg);color:var(--ok)}
.b-low{background:var(--warnbg);color:var(--warn)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gauge{position:relative;width:128px;height:128px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:'Source Serif 4',serif;font-size:28px;font-weight:700;color:var(--warn)}
.gauge .v small{display:block;font:500 11px 'Public Sans';color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:10px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.decl{background:#fafbfd;border:1px dashed #b7c1d1;border-radius:8px;padding:14px;font-family:'Source Serif 4',serif;font-size:16px;line-height:1.65}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:500}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.digital-stamp{background:#eef3fb;border:1.5px solid #c2d2ea;border-radius:8px;padding:14px;margin-top:16px;font-size:13px;color:var(--ink)}
.digital-stamp b{color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
.stat b{font:700 26px 'Source Serif 4',serif;display:block}
.stat span{font-size:12px;color:var(--ink2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:150px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .who{min-width:0;flex:1 1 240px}
.row .who b{display:block}
.row .who span{font-size:13px;color:var(--ink2);word-break:break-all}
.row .actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pct{font:700 18px 'Source Serif 4',serif;color:var(--warn);min-width:55px;text-align:right}
.empty{text-align:center;padding:30px 10px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:99;max-width:90vw}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}}
.loader{text-align:center;padding:60px;color:var(--ink2)}
.tpl-link{font-size:12px;font-weight:600;color:var(--brand2);cursor:pointer;text-decoration:underline;float:right}
.blast-box{background:#f0f8f5;border:1.5px solid #a3d9c9;border-radius:8px;padding:14px;margin-bottom:16px}
.blast-box h4{margin:0 0 6px;color:var(--wa-hover)}
.blast-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal-body{background:#fff;padding:24px;border-radius:12px;max-width:480px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}
</style>
</head>
<body>
<div id="app"><div class="loader">Loading…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyBXECIZa45dq-o8Ka4G9Y1N7nll7cyli2U",
    authDomain: "stuattnd.firebaseapp.com",
    projectId: "stuattnd",
    storageBucket: "stuattnd.firebasestorage.app",
    messagingSenderId: "511533506488",
    appId: "1:511533506488:web:aca4de3d513915d012f94d",
    measurementId: "G-9PZZM5LFKX"
  },
  institution: "RGMCET-CSE(AI&ML)",
  term: "2026-ODD",
  minAtt: 75,
  basePath: "artifacts/att-mail"
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanStr = s => String(s ?? '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
const app = $('#app');
let auth, db;

const S = { 
  user: null, 
  role: null, 
  student: null, 
  hod: null, 
  rows: [], 
  filter: 'all', 
  q: '', 
  portalMode: 'student',
  authTab: 'in'
};

const pCol = name => `${CONFIG.basePath}/${name}`;
const pDoc = (col, id) => `${CONFIG.basePath}/${col}/${id}`;

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}

function friendly(e){
  const m={ 
    'auth/invalid-credential':'Wrong email or password.',
    'auth/user-not-found':'No account with this email.',
    'auth/wrong-password':'Wrong email or password.',
    'auth/email-already-in-use':'An account already exists. Please Sign In.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/invalid-email':'Enter a valid email address.',
    'auth/too-many-requests':'Too many attempts. Try again in a few minutes.',
    'permission-denied':'Access denied. Check Firestore security rules or permissions.' 
  };
  return m[e.code] || e.message || 'Something went wrong.';
}

/* =====================================================================
   WHATSAPP CLICK-TO-CHAT & BROADCAST GENERATOR
   ===================================================================== */
function formatPhone(phone, defaultCountry = '91'){
  if(!phone) return '';
  let digits = String(phone).replace(/\D/g, '');
  if(!digits) return '';
  if(digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
  if(digits.length === 10) digits = defaultCountry + digits;
  return digits;
}

function getPortalUrl(){
  return location.href.split('#')[0];
}

function studentMessage(s){
  return `*ATTENDANCE SHORTAGE NOTICE*
Dear ${s.name} (${s.roll}),

Your recorded attendance for Term *${s.term || CONFIG.term}* in Department of *${s.dept}* is *${s.att}%*, which is below the required minimum of *${CONFIG.minAtt}%*.

Please log in to the student portal to review and submit your official digital shortage declaration:
🔗 ${getPortalUrl()}

- Office of Head of Department, ${s.dept}
${CONFIG.institution}`;
}

function parentMessage(s){
  return `*IMPORTANT ATTENDANCE NOTICE FOR PARENTS*
Dear Parent / Guardian,

This is an official communication regarding your ward *${s.name}* (Roll No: *${s.roll}*), Department of *${s.dept}*, ${CONFIG.institution}.

The student's attendance for Term *${s.term || CONFIG.term}* is *${s.att}%*, which is below the mandatory *${CONFIG.minAtt}%*.

The student has been directed to submit an official shortage declaration via the student portal:
🔗 ${getPortalUrl()}

Kindly ensure your ward submits the declaration immediately.

- Office of Head of Department, ${s.dept}
${CONFIG.institution}`;
}

function buildStudentWaLink(s){
  const phone = formatPhone(s.mobile);
  if(!phone) return null;
  return `https://wa.me/${phone}?text=${encodeURIComponent(studentMessage(s))}`;
}

function buildParentWaLink(s){
  const phone = formatPhone(s.parentMobile);
  if(!phone) return null;
  return `https://wa.me/${phone}?text=${encodeURIComponent(parentMessage(s))}`;
}

/* =====================================================================
   BOOT & SESSIONS
   ===================================================================== */
function boot(){
  if (CONFIG.firebase.apiKey === 'YOUR_API_KEY'){ 
    app.innerHTML = '<div class="wrap"><div class="card"><h2>Firebase configuration required.</h2></div></div>';
    return;
  }
  firebase.initializeApp(CONFIG.firebase);
  auth = firebase.auth(); 
  db = firebase.firestore();

  auth.onAuthStateChanged(async u=>{
    S.user = u; S.role = null; S.student = null; S.hod = null; S.rows = [];
    if(!u) return viewAuth();

    app.innerHTML = '<div class="loader">Verifying session…</div>';
    try{
      const email = u.email.toLowerCase();

      if (S.portalMode === 'admin') {
        const hd = await db.doc(pDoc('hods', email)).get();
        if (!hd.exists) {
          await auth.signOut();
          return viewAuth('Access denied: No Admin/HOD account exists with this email.');
        }
        S.role = 'hod'; 
        S.hod = { id: hd.id, ...hd.data() }; 
        await loadRows(); 
        return viewHod();
      } else {
        const sd = await db.doc(pDoc('students', email)).get();
        S.role = 'student';
        if (sd.exists) {
          S.student = { id: sd.id, ...sd.data() };
        }
        return viewStudent();
      }
    }catch(e){ 
      await auth.signOut();
      viewAuth(friendly(e)); 
      toast(friendly(e)); 
    }
  });
}

function header(sub){
  return `<div class="top">
    <div><b>${esc(CONFIG.institution)}</b><small>${esc(sub)} · ${esc(S.user?.email||'')}</small></div>
    <button class="btn small light" id="out">Sign out</button>
  </div>`;
}

function bindOut(){ 
  $('#out').onclick = () => auth.signOut(); 
}

function viewAuth(error){
  const isAdmin = S.portalMode === 'admin';
  const up = S.authTab === 'up';

  app.innerHTML = `<div class="wrap"><div class="auth">
   <h1>${esc(CONFIG.institution)}</h1>
   <p class="note">Attendance Declaration & Portal</p>
   
   <div class="portal-switch">
     <button id="sw-std" class="${!isAdmin ? 'active' : ''}">Student Portal</button>
     <button id="sw-adm" class="${isAdmin ? 'active' : ''}">Admin / HOD Portal</button>
   </div>

   <div class="card">
    <div class="tabs">
      <button id="t-in" class="${up ? '' : 'on'}">Sign In</button>
      <button id="t-up" class="${up ? 'on' : ''}">Create ${isAdmin ? 'HOD' : 'Student'} Account</button>
    </div>

    ${isAdmin && up ? `
      <label for="hn">HOD / Admin Full Name</label>
      <input id="hn" type="text" placeholder="e.g. Dr. A. Sharma">
      <label for="hd">Department Code</label>
      <input id="hd" type="text" placeholder="e.g. AIML, CSE, ECE">
    ` : ''}

    <label for="em">${isAdmin ? 'Institutional Admin / HOD Email' : 'Student College Email'}</label>
    <input id="em" type="email" autocomplete="email" placeholder="${isAdmin ? 'hod.aiml@ilabs.com' : 'student@college.edu'}">
    
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}">
    
    ${error ? `<div class="err">${esc(error)}</div>` : ''}
    
    <button class="btn" id="go" style="width:100%;margin-top:16px">
      ${up ? (isAdmin ? 'Create HOD Account' : 'Create Student Account') : (isAdmin ? 'Sign In as Admin / HOD' : 'Sign In as Student')}
    </button>
    
    ${!up ? '<p style="text-align:center;margin:12px 0 0"><a href="#" id="fg" class="note">Forgot password?</a></p>' : ''}
   </div>
  </div></div>`;

  $('#sw-std').onclick = () => { S.portalMode = 'student'; S.authTab = 'in'; viewAuth(); };
  $('#sw-adm').onclick = () => { S.portalMode = 'admin'; S.authTab = 'in'; viewAuth(); };
  $('#t-in').onclick = () => { S.authTab = 'in'; viewAuth(); };
  $('#t-up').onclick = () => { S.authTab = 'up'; viewAuth(); };

  const go = async () => {
    const e = $('#em').value.trim().toLowerCase();
    const p = $('#pw').value;
    if(!e || !p) return viewAuth('Please enter your email and password.');

    const btn = $('#go');
    btn.disabled = true; btn.textContent = 'Processing…';

    try {
      if (up) {
        if (isAdmin) {
          const name = $('#hn').value.trim();
          const dept = $('#hd').value.trim().toUpperCase();
          if(!name || !dept) {
            btn.disabled = false; btn.textContent = 'Create HOD Account';
            return viewAuth('Name and Department code are required for HOD registration.');
          }
          await auth.createUserWithEmailAndPassword(e, p);
          await db.doc(pDoc('hods', e)).set({
            name: name,
            dept: dept,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.createUserWithEmailAndPassword(e, p);
        }
      } else {
        await auth.signInWithEmailAndPassword(e, p);
      }
    } catch(x) { 
      viewAuth(friendly(x)); 
      $('#em').value = e; 
    }
  };

  $('#go').onclick = go;
  $('#pw').onkeydown = k => { if(k.key === 'Enter') go(); };

  const fg = $('#fg');
  if(fg) fg.onclick = async ev => {
    ev.preventDefault();
    const e = $('#em').value.trim();
    if(!e) return toast('Type your email first.');
    try {
      await auth.sendPasswordResetEmail(e);
      toast('Reset link sent. Check your inbox.');
    } catch(x) {
      toast(friendly(x));
    }
  };
}

/* =====================================================================
   STUDENT PORTAL
   ===================================================================== */
function gauge(p){
  const r=54,c=2*Math.PI*r,off=c*(1-Math.min(p,100)/100);
  return `<div class="gauge"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="#e3e8f0" stroke-width="12"/>
  <circle cx="64" cy="64" r="${r}" fill="none" stroke="#b4231a" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
  <div class="v"><div>${p}%<small>attendance</small></div></div></div>`;
}

function declText(s){
  return `I, <b>${esc(s.name)}</b> (Roll No. <b>${esc(s.roll)}</b>), a student of the Department of <b>${esc(s.dept)}</b>, confirm that my attendance for term <b>${esc(s.term||CONFIG.term)}</b> is <b>${esc(s.att)}%</b>, which is below the required minimum of ${CONFIG.minAtt}%. I have been informed of this shortage and I accept the consequences under the institution's attendance regulations, which may include debarment from examinations, payment of a condonation fee, or other action decided by the institution. I submit this declaration voluntarily.`;
}

function viewStudent(){
  const s = S.student;
  let body = '';
  if(!s){
    body = `<div class="card empty">
      <h2>No Shortage Notice Found</h2>
      <p>Your record is in good standing (at or above ${CONFIG.minAtt}%), or your department has not uploaded shortage records for this term.</p>
    </div>`;
  } else if(s.status === 'signed'){
    body = `<div class="card"><span class="badge b-sign">Declaration Submitted</span>
      <h2 style="margin-top:10px">Acknowledgement Verified, ${esc(s.name)}</h2>
      <p class="note">Your digital acknowledgement is permanently recorded with your HOD (${esc(s.hodEmail || 'Department')}).</p>
      <button class="btn" id="dl">Download A4 PDF Acknowledgement</button>
    </div>`;
  } else {
    body = `<div class="card"><div class="hero">${gauge(s.att)}
      <div style="flex:1;min-width:200px"><span class="badge b-low">Below ${CONFIG.minAtt}%</span>
      <h2 style="margin:8px 0 4px">Attendance Shortage Notice</h2>
      <dl class="kv">
        <dt>Name</dt><dd>${esc(s.name)}</dd>
        <dt>Roll no.</dt><dd>${esc(s.roll)}</dd>
        <dt>Mobile</dt><dd>${esc(s.mobile || '—')}</dd>
        <dt>Parent Phone</dt><dd>${esc(s.parentMobile || '—')}</dd>
        <dt>Department</dt><dd>${esc(s.dept)}</dd>
        <dt>Term</dt><dd>${esc(s.term||CONFIG.term)}</dd>
      </dl></div></div></div>
      <div class="card"><h3 style="margin-bottom:10px">Declaration Statement</h3>
       <div class="decl">${declText(s)}</div>
       <label class="chk"><input type="checkbox" id="ok"><span>I have read this declaration and accept the consequences of attendance below ${CONFIG.minAtt}%.</span></label>
       <label for="tn">Type your full name to authenticate submission</label>
       <input id="tn" type="text" autocomplete="off" placeholder="${esc(s.name)}">
       <div class="digital-stamp">
         <b>Digital Verification Note:</b> Hand-drawn signatures are suspended. Submitting with your authenticated institutional account (<code>${esc(s.id)}</code>) and typed legal name constitutes your official digital acknowledgement.
       </div>
       <div id="msg"></div>
       <button class="btn" id="sub" style="width:100%;margin-top:16px">Authenticate & Submit Declaration</button>
      </div>`;
  }
  app.innerHTML = header('Student Portal') + `<div class="wrap">${body}</div>`;
  bindOut();

  if(s && s.status === 'signed') $('#dl').onclick = () => downloadFor(s.id, $('#dl'));
  if(s && s.status !== 'signed') $('#sub').onclick = submitDeclaration;
}

async function submitDeclaration(){
  const s = S.student, msg = $('#msg');
  const fail = t => { msg.innerHTML = `<div class="err">${esc(t)}</div>`; };
  if(!$('#ok').checked) return fail('Please tick the box acknowledging attendance regulations.');
  
  if(cleanStr($('#tn').value) !== cleanStr(s.name)) {
    return fail('Type your name exactly as registered: ' + s.name);
  }

  const btn = $('#sub'); btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const ts = firebase.firestore.FieldValue.serverTimestamp();
    const data = {
      email: s.id,
      name: s.name,
      roll: s.roll,
      mobile: s.mobile || '',
      parentMobile: s.parentMobile || '',
      dept: s.dept,
      att: s.att,
      term: s.term || CONFIG.term,
      hodEmail: s.hodEmail || '',
      typedName: $('#tn').value.trim()
    };
    const pdf = buildPdf({ ...data, signedAt: new Date() });
    const b64 = pdf.output('datauristring').split(',')[1];
    const fname = `Declaration_${s.roll}.pdf`;

    const batch = db.batch();
    batch.set(db.doc(pDoc('declarations', `${data.term}_${s.id}`)), { ...data, signedAt: ts });
    batch.update(db.doc(pDoc('students', s.id)), { status: 'signed', signedAt: ts });

    if(s.hodEmail){
      batch.set(db.collection(pCol('mail')).doc(), {
        to: [s.hodEmail],
        cc: [s.id],
        message: {
          subject: `Attendance declaration signed – ${s.name} (${s.roll})`,
          html: `<p>${esc(s.name)} (${esc(s.roll)}, ${esc(s.dept)}) has submitted digital declaration for attendance of ${esc(s.att)}%.</p>
                 <p><b>Mobile:</b> ${esc(s.mobile || 'N/A')}<br><b>Parent Mobile:</b> ${esc(s.parentMobile || 'N/A')}</p>
                 <p>The signed acknowledgement is attached.</p>`,
          attachments: [{ filename: fname, path: 'data:application/pdf;base64,' + b64 }]
        }
      });
    }
    await batch.commit();
    pdf.save(fname);
    S.student = { ...s, status: 'signed' }; 
    viewStudent(); 
    toast('Declaration submitted successfully.');
  } catch(e) { 
    btn.disabled = false; btn.textContent = 'Authenticate & Submit Declaration'; 
    fail(friendly(e)); 
  }
}

async function downloadFor(email, btn){
  const old = btn?.textContent; 
  if(btn){ btn.disabled = true; btn.textContent = 'Generating PDF…'; }
  try {
    const d = await db.doc(pDoc('declarations', `${CONFIG.term}_${email}`)).get();
    if(!d.exists) throw new Error('Declaration document not found for this term.');
    const x = d.data(); 
    const pdf = buildPdf({ ...x, signedAt: x.signedAt?.toDate?.() || new Date() });
    pdf.save(`Declaration_${x.roll}.pdf`);
  } catch(e) {
    toast(friendly(e));
  }
  if(btn){ btn.disabled = false; btn.textContent = old; }
}

/* =====================================================================
   A4 PDF GENERATION
   ===================================================================== */
function buildPdf(d){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 18;
  doc.setDrawColor(29, 58, 110); doc.setLineWidth(.6); doc.rect(8, 8, W - 16, 297 - 16);
  doc.setTextColor(22, 36, 58);
  doc.setFont('times', 'bold'); doc.setFontSize(17); doc.text(CONFIG.institution, W / 2, 26, { align: 'center' });
  doc.setFont('times', 'normal'); doc.setFontSize(12); doc.text(`Department of ${d.dept}`, W / 2, 33, { align: 'center' });
  doc.setLineWidth(.3); doc.line(M, 38, W - M, 38);
  doc.setFont('times', 'bold'); doc.setFontSize(14);
  doc.text('ACKNOWLEDGEMENT OF ATTENDANCE SHORTAGE', W / 2, 48, { align: 'center' });
  doc.setFontSize(11); doc.setFont('helvetica', 'normal');
  const when = (d.signedAt instanceof Date ? d.signedAt : new Date());
  doc.text(`Ref: ASD/${d.term}/${d.roll}`, M, 58);
  doc.text(`Date: ${when.toLocaleDateString('en-GB')}  ${when.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`, W - M, 58, { align: 'right' });

  const rows = [
    ['Student name', d.name],
    ['Roll number', d.roll],
    ['Department', d.dept],
    ['Email', d.email],
    ['Student Mobile', d.mobile || '—'],
    ['Parent Contact', d.parentMobile || '—'],
    ['Term', d.term],
    ['Attendance recorded', `${d.att}%`],
    ['Minimum required', `${CONFIG.minAtt}%`]
  ];
  let y = 68; doc.setFontSize(10.5);
  rows.forEach((r, i) => {
    if(i % 2 === 0){ doc.setFillColor(244, 246, 249); doc.rect(M, y - 5, W - 2 * M, 7.5, 'F'); }
    doc.setFont('helvetica', 'bold'); doc.text(r[0], M + 3, y);
    doc.setFont('helvetica', 'normal'); doc.text(String(r[1]), M + 60, y); 
    y += 7.5;
  });
  y += 6; doc.setFont('times', 'bold'); doc.setFontSize(13); doc.text('Declaration Statement', M, y); y += 7;
  doc.setFont('times', 'normal'); doc.setFontSize(11.5);
  const plain = `I, ${d.name} (Roll No. ${d.roll}), a student of the Department of ${d.dept}, confirm that my attendance for term ${d.term} is ${d.att}%, which is below the required minimum of ${CONFIG.minAtt}%. I have been informed of this shortage and I accept the consequences under the institution's attendance regulations, which may include debarment from examinations, payment of a condonation fee, or other action decided by the institution. I submit this declaration voluntarily.`;
  const lines = doc.splitTextToSize(plain, W - 2 * M); doc.text(lines, M, y, { lineHeightFactor: 1.45 });
  y += lines.length * 6.5 + 16;

  doc.setFillColor(245, 247, 252);
  doc.setDrawColor(180, 195, 220);
  doc.rect(M, y, W - 2 * M, 24, 'FD');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(29, 58, 110);
  doc.text('OFFICIAL DIGITAL ATTESTATION', M + 4, y + 6);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(60, 70, 85);
  doc.text(`Electronically submitted and verified via user session (${d.email}).`, M + 4, y + 12);
  doc.text(`Typed Legal Name: ${d.typedName || d.name}  |  Timestamp: ${when.toISOString()}`, M + 4, y + 18);

  y += 36;
  doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(22, 36, 58);
  doc.text('Student Acknowledgement', M, y);
  doc.text('Acknowledged by HOD', W - M - 60, y);
  y += 18;
  doc.setLineWidth(.3); doc.line(M, y, M + 70, y); doc.line(W - M - 70, y, W - M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(d.typedName || d.name, M, y + 6);
  doc.text(d.hodEmail || 'Head of Department', W - M - 70, y + 6);

  doc.setFontSize(8); doc.setTextColor(110, 120, 135);
  doc.text(`Digitally recorded by authenticated institutional account. Tamper-evident system log.`, W / 2, 286, { align: 'center' });
  return doc;
}

function triggerDownload(content, filename){
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function copyToClipboard(text, successMsg){
  navigator.clipboard.writeText(text).then(()=>{
    toast(successMsg);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast(successMsg);
  });
}

function parseCsv(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"' && text[i + 1] === '"'){ cur += '"'; i++; }
      else if(c === '"') q = false; 
      else cur += c;
    } else if(c === '"'){
      q = true;
    } else if(c === ','){
      row.push(cur); cur = '';
    } else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i + 1] === '\n') i++; 
      row.push(cur); cur = ''; 
      if(row.some(v => v.trim())) rows.push(row); 
      row = [];
    } else {
      cur += c;
    }
  }
  row.push(cur); 
  if(row.some(v => v.trim())) rows.push(row);
  return rows;
}

/* 1. MASTER DIRECTORY IMPORT */
async function importMasterCsv(ev){
  const f = ev.target.files[0]; if(!f) return;
  const box = $('#mMsg'); box.innerHTML = '<p class="note">Reading master directory…</p>';
  try {
    const rows = parseCsv(await f.text());
    if(!rows.length) throw new Error('Master CSV file is empty.');
    
    const rawHead = rows.shift();
    const head = rawHead.map(h => h.trim().toLowerCase().replace(/[\s\-_]/g, ''));
    const findCol = (...aliases) => head.findIndex(h => aliases.some(a => h.includes(a)));

    const iR = findCol('rollno', 'roll');
    const iN = findCol('name', 'studentname');
    const iM = findCol('mobile', 'phone', 'contact');
    const iE = findCol('email', 'mail');
    const iP = findCol('parentmobile', 'parentphone', 'parentcontact', 'father', 'mother');

    if(iR < 0 || iN < 0 || iE < 0) {
      throw new Error('Master CSV requires columns: roll no, name, email (mobile and parent-mobile are optional).');
    }

    const ops = []; let bad = 0;
    for(const r of rows){
      const roll = (r[iR] || '').trim();
      const email = (r[iE] || '').trim().toLowerCase();
      const name = (r[iN] || '').trim();
      const mobile = iM >= 0 ? (r[iM] || '').trim() : '';
      const parentMobile = iP >= 0 ? (r[iP] || '').trim() : '';

      if(!roll || !email.includes('@') || !name){ bad++; continue; }

      const record = {
        roll, name, email, mobile, parentMobile,
        dept: S.hod.dept,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      ops.push([roll.toUpperCase(), record]);
    }

    const totalBatches = Math.ceil(ops.length / 450);
    for(let i = 0; i < ops.length; i += 450){
      const batchNum = Math.floor(i / 450) + 1;
      box.innerHTML = `<p class="note">Saving batch ${batchNum} of ${totalBatches}…</p>`;
      const b = db.batch(); 
      ops.slice(i, i + 450).forEach(([rollKey, data]) => {
        b.set(db.doc(pDoc('master_students', rollKey)), data, { merge: true });
      }); 
      await b.commit();
    }

    box.innerHTML = `<p class="note" style="color:var(--ok)"><b>${ops.length}</b> master student records stored${bad ? ` · ${bad} invalid lines skipped` : ''}.</p>`;
    toast(`Master directory updated: ${ops.length} students loaded.`);
  } catch(e) {
    box.innerHTML = `<div class="err">${esc(friendly(e))}</div>`;
  }
}

/* 2. TERM SHORTAGE IMPORT (CHUNKED IN-QUERIES) */
async function importShortageCsv(ev){
  const f = ev.target.files[0]; if(!f) return;
  const box = $('#sMsg'); box.innerHTML = '<p class="note">Parsing shortage CSV…</p>';
  try {
    const rows = parseCsv(await f.text());
    if(!rows.length) throw new Error('Shortage CSV file is empty.');
    
    const rawHead = rows.shift();
    const head = rawHead.map(h => h.trim().toLowerCase().replace(/[\s\-_]/g, ''));
    const findCol = (...aliases) => head.findIndex(h => aliases.some(a => h.includes(a)));

    const iR = findCol('rollno', 'roll');
    const iE = findCol('email', 'mail');
    const iA = findCol('attendance', 'att', 'pct', 'percentage');

    if(iA < 0 || (iR < 0 && iE < 0)) {
      throw new Error('Shortage CSV must include attendance and roll no (or email).');
    }

    const candidateRows = [];
    let skipped = 0, bad = 0;

    for(const r of rows){
      const rawAtt = (r[iA] || '').replace('%', '').trim();
      const att = parseFloat(rawAtt);
      if(isNaN(att)){ bad++; continue; }
      if(att >= CONFIG.minAtt){ skipped++; continue; }

      const rollVal = iR >= 0 ? (r[iR] || '').trim().toUpperCase() : '';
      const emailVal = iE >= 0 ? (r[iE] || '').trim().toLowerCase() : '';
      if(!rollVal && !emailVal){ bad++; continue; }

      candidateRows.push({ roll: rollVal, email: emailVal, att: Math.round(att * 10) / 10 });
    }

    if(!candidateRows.length){
      box.innerHTML = `<p class="note">No shortage records below ${CONFIG.minAtt}% found (${skipped} students passed).</p>`;
      return;
    }

    box.innerHTML = `<p class="note">Looking up ${candidateRows.length} students in Master Directory…</p>`;

    const masterMap = {};
    const rollKeys = [...new Set(candidateRows.map(c => c.roll).filter(Boolean))];

    for(let i = 0; i < rollKeys.length; i += 30){
      const chunk = rollKeys.slice(i, i + 30);
      const snap = await db.collection(pCol('master_students'))
        .where(firebase.firestore.FieldPath.documentId(), 'in', chunk)
        .get();
      snap.docs.forEach(doc => {
        masterMap[doc.id] = doc.data();
      });
    }

    const existingStudents = Object.fromEntries(S.rows.map(r => [r.id, r]));
    const ops = []; 
    let notFound = 0;

    for(const item of candidateRows){
      const master = masterMap[item.roll];
      if(!master || master.dept !== S.hod.dept){ 
        notFound++; 
        continue; 
      }

      const email = master.email.toLowerCase();
      const keep = existingStudents[email];

      const base = {
        name: master.name,
        roll: master.roll,
        mobile: master.mobile || '',
        parentMobile: master.parentMobile || '',
        dept: S.hod.dept,
        att: item.att,
        term: CONFIG.term,
        hodEmail: S.hod.id
      };

      ops.push([
        email, 
        keep && keep.status === 'signed' 
          ? { ...base, status: 'signed', signedAt: keep.signedAt || null } 
          : { ...base, status: 'pending', alerted: false }
      ]);
    }

    const totalBatches = Math.ceil(ops.length / 450);
    for(let i = 0; i < ops.length; i += 450){
      const batchNum = Math.floor(i / 450) + 1;
      box.innerHTML = `<p class="note">Writing shortage batch ${batchNum} of ${totalBatches}…</p>`;
      const b = db.batch(); 
      ops.slice(i, i + 450).forEach(([id, data]) => b.set(db.doc(pDoc('students', id)), data, { merge: true })); 
      await b.commit();
    }

    await loadRows(); 
    viewHod();
    box.innerHTML = `<p class="note" style="color:var(--ok)"><b>${ops.length}</b> shortage records stored · ${skipped} with attendance ≥${CONFIG.minAtt}% skipped${notFound ? ` · <b>${notFound} students not found in Master Directory</b>` : ''}${bad ? ` · ${bad} invalid lines ignored` : ''}.</p>`;
  } catch(e) { 
    box.innerHTML = `<div class="err">${esc(friendly(e))}</div>`; 
  }
}

async function sendAlerts(){
  const todo = S.rows.filter(r => r.status !== 'signed' && !r.alerted);
  if(!todo.length) return;
  if(!confirm(`Send email notices to ${todo.length} student(s)?`)) return;
  const btn = $('#alerts'); btn.disabled = true; btn.textContent = 'Queueing…';
  try {
    const url = getPortalUrl();
    for(let i = 0; i < todo.length; i += 200){
      const b = db.batch();
      todo.slice(i, i + 200).forEach(s => {
        b.set(db.collection(pCol('mail')).doc(), {
          to: [s.id],
          message: {
            subject: `Action Required: Attendance Shortage (${s.roll})`,
            html: `<p>Dear ${esc(s.name)},</p><p>Your attendance for ${esc(s.term || CONFIG.term)} is <b>${esc(s.att)}%</b>, which is below the mandatory ${CONFIG.minAtt}%.</p>
                   <p>Please log in to review and submit your digital declaration:</p><p><a href="${url}">${url}</a></p>
                   <p>Regards,<br>Office of the Head of Department, ${esc(s.dept)}</p>`
          }
        });
        b.update(db.doc(pDoc('students', s.id)), { alerted: true });
      });
      await b.commit();
    }
    todo.forEach(s => s.alerted = true); 
    viewHod(); 
    toast(`${todo.length} alert(s) queued successfully.`);
  } catch(e) { 
    toast(friendly(e)); 
    btn.disabled = false; 
  }
}

boot();
</script>
